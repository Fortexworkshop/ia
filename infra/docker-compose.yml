# Stack serveur FORTEX : Mosquitto (MQTTS) + PostgreSQL + supervision (Prometheus + Grafana).
# Prerequis : .env (copie de .env.example), ./scripts/gen-certs.sh, ./scripts/gen-mqtt-users.sh
# Lancement : docker compose up -d
# Le backend tourne sur le PC serveur (il pilote la webcam et la reconnaissance faciale) :
#   python scripts/backend.py  (lance par scripts/start.ps1)
# Backend en conteneur (sans webcam ni visages) : docker compose --profile backend-docker up -d --build
# Simulateur IoT (sans boitier) : docker compose --profile simulation up -d
# Grafana : http://localhost:3001 (admin / GRAFANA_ADMIN_PASSWORD)

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"   # MCO : les logs ne remplissent pas le disque
      max-file: "3"

services:

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2
    container_name: fortex-mosquitto
    ports:
      - "8883:8883"     # MQTTS uniquement, plus de port 1883 en clair
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/server.key:/mosquitto/certs/server.key:ro

  postgres:
    <<: *hardening
    image: postgres:16
    container_name: fortex-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}   # compte grafana_ro (02-grafana-readonly.sh)
    ports:
      - "127.0.0.1:5433:5432"   # backend sur le PC serveur uniquement (localhost, pas le reseau)
    volumes:
      - fortex-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    <<: *hardening
    profiles: ["backend-docker"]   # par defaut le backend tourne sur le PC (webcam, visages)
    build:
      context: ${IA_DIR:-..}
      dockerfile: backend/Dockerfile
    image: fortex-backend
    container_name: fortex-backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FORTEX_DB_HOST: postgres
      FORTEX_DB_PORT: "5432"
      SENTINEL_MQTT_HOST: mosquitto
      SENTINEL_MQTT_PORT: "8883"
      SENTINEL_MQTT_CA_CERT: /certs/ca.crt
      SENTINEL_MQTT_USER: serveur
      SENTINEL_MQTT_PASSWORD: ${SERVEUR_MQTT_PASSWORD}
      SENTINEL_API_TOKEN: ${API_TOKEN}
      SENTINEL_NODE_ID: SENTINEL-X-01
      FORTEX_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.1.0
    container_name: fortex-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d   # MCO : historique borne
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fortex-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Pas de port publie : seul Grafana le lit (reseau Docker interne)

  grafana:
    <<: *hardening
    image: grafana/grafana-oss:11.5.2
    container_name: fortex-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fortex.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}   # lu par provisioning/datasources
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fortex-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

  simulator:
    <<: *hardening
    profiles: ["simulation"]   # desactive par defaut : ne pas melanger avec les vraies mesures
    build:
      context: ./simulator
    container_name: fortex-simulator
    read_only: true
    cap_drop:
      - ALL
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_TOPIC: fortex/capteurs/mesures
      MQTT_USER: esp8266
      MQTT_PASSWORD: ${ESP_MQTT_PASSWORD}
      MQTT_CA_CERT: /certs/ca.crt
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      - mosquitto

volumes:
  fortex-postgres-data:
  fortex-prometheus-data:
  fortex-grafana-data:
