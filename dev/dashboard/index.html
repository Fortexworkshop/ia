<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FORTEX : supervision du site SENTINEL-X (capteurs, alarmes, vision, présence)." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 6 6v4H2l4 6-4 6h4v4l10 4 10-4v-4h4l-4-6 4-6h-4V6L16 2z' fill='%230d1117' stroke='%2379aaf7' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2379aaf7'/%3E%3C/svg%3E" />
    <title>FORTEX Supervision</title>
    <script>
      // Thème appliqué avant le premier affichage : pas de flash ni de changement visuel au chargement
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <style>
      /* Fond critique en ligne : la page n'apparaît jamais blanche avant le CSS */
      html { background: #0d1117; color: #e6e9ee; font-family: system-ui, sans-serif; }
      @media (prefers-color-scheme: light) { html:not([data-theme='dark']) { background: #f3f4f6; color: #141820; } }
      html[data-theme='light'] { background: #f3f4f6; color: #141820; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Le tableau de supervision FORTEX nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
